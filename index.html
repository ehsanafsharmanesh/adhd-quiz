<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پرسشنامه تشخیص ADHD (والدین)</title>
    
    <style>
        /* --- تنظیمات فونت محلی (اصلاح شده برای مسیر static) --- */
        @font-face {
            font-family: 'Vazirmatn';
            src: url('./static/mycustomfonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('./static/mycustomfonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        /* --- متغیرهای رنگی و پایه --- */
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --success: #28a745;
            --success-hover: #218838;
            --danger: #dc3545;
            --warning: #ffc107;
            --bg-color: #eef2f7;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 24px rgba(149, 157, 165, 0.2);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* --- ریست و تنظیمات کلی --- */
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- کانتینر اصلی --- */
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            display: none;
            position: relative;
            overflow: hidden;
        }
        .container.active {
            display: block;
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* --- تایپوگرافی --- */
        h1 { font-size: 1.6rem; color: var(--primary); text-align: center; margin-bottom: 10px; font-weight: 700; }
        h3 { font-size: 1rem; color: var(--text-muted); text-align: center; margin-bottom: 30px; font-weight: 400; line-height: 1.5; }

        /* --- فرم و ورودی‌ها --- */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; color: var(--text-main); }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition);
            background-color: #f8f9fa;
        }
        .form-group input:focus {
            border-color: var(--primary);
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.15);
        }

        /* --- دکمه‌های مدرن --- */
        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            color: white;
            text-decoration: none;
            width: 100%;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--success); box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3); }
        .btn-primary:hover { background: var(--success-hover); box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4); transform: translateY(-2px); }
        
        .btn-nav { background: #f1f3f5; color: var(--text-main); border: 1px solid var(--border-color); width: 48%; font-size: 1rem; }
        .btn-nav:hover:not(:disabled) { background: #e2e6ea; }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- نوار پیشرفت --- */
        .progress-wrapper { margin-bottom: 25px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; }
        .progress-track { width: 100%; height: 10px; background: #e9ecef; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 10px; transition: width 0.4s ease; width: 0%; }

        /* --- بخش سوالات --- */
        .question-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 25px; line-height: 1.6; color: var(--text-main); animation: fadeIn 0.4s ease; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-card {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .option-card:hover { border-color: #b3d7ff; background: #f0f8ff; }
        .option-card.selected {
            border-color: var(--success);
            background: #d4edda;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.15);
        }
        .option-card input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
        .custom-radio {
            width: 22px; height: 22px;
            border: 2px solid #adb5bd;
            border-radius: 50%;
            margin-left: 15px;
            display: inline-block;
            position: relative;
            transition: var(--transition);
        }
        .option-card.selected .custom-radio { border-color: var(--success); }
        .option-card.selected .custom-radio::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 12px; height: 12px;
            background: var(--success); border-radius: 50%;
        }
        .option-text { font-size: 1.05rem; color: var(--text-main); font-weight: 400; }
        .option-card.selected .option-text { font-weight: 700; color: #155724; }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; gap: 10px; }

        /* --- صفحه نتایج --- */
        .alert-info {
            background: #e7f3fe; color: #0c5460; padding: 15px;
            border-radius: 12px; text-align: center; font-size: 0.9rem;
            margin-bottom: 25px; border: 1px solid #bee5eb; line-height: 1.6;
        }
        .score-card {
            text-align: center; background: #fff;
            padding: 30px 20px; border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm); margin-bottom: 25px;
        }
        .score-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 15px; color: var(--text-main); }
        .score-value {
            font-size: 3rem; font-weight: 700; color: var(--primary); line-height: 1;
            animation: pulseGlow 2s infinite;
        }
        .score-total { font-size: 1rem; color: var(--text-muted); margin-top: 10px; }

        .recommendation-card { padding: 25px; border-radius: 16px; border-right: 6px solid; background: #fafafa; margin-bottom: 25px; }
        .recommendation-card.mild { border-color: var(--success); background: #f0fdf4; }
        .recommendation-card.moderate { border-color: var(--warning); background: #fffbeb; }
        .recommendation-card.severe { border-color: var(--danger); background: #fef2f2; }
        .rec-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; }
        .mild .rec-title { color: var(--success); }
        .moderate .rec-title { color: #b7791f; }
        .severe .rec-title { color: var(--danger); }
        
        .rec-list { padding-right: 20px; line-height: 1.8; color: var(--text-main); font-size: 0.95rem; }
        .rec-list li { margin-bottom: 8px; }
        .rec-list hr { margin: 15px 0; border: none; border-top: 1px dashed #ccc; }
        .rec-list .emergency { font-weight: 700; list-style: none; color: #333; padding: 5px 0; }

        .actions-grid { display: flex; gap: 15px; flex-wrap: wrap; }
        .actions-grid .btn { flex: 1; min-width: 140px; }
        .btn-print { background: var(--primary); box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3); }
        .btn-print:hover { background: var(--primary-hover); }
        .btn-restart { background: #6c757d; box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3); }
        .btn-restart:hover { background: #5a6268; }

        /* --- انیمیشن‌ها --- */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseGlow {
            0% { transform: scale(1); text-shadow: 0 0 0 rgba(0,123,255,0); }
            50% { transform: scale(1.05); text-shadow: 0 0 20px rgba(0,123,255,0.4); }
            100% { transform: scale(1); text-shadow: 0 0 0 rgba(0,123,255,0); }
        }

        /* --- استایل چاپ --- */
        .print-header { display: none; }
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; padding: 0; display: none; }
            .container.active { display: block; }
            .actions-grid, .alert-info, .progress-wrapper { display: none !important; }
            .print-header { display: block; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
            .score-value { animation: none; color: #000; }
        }

        /* --- موبایل و ریسپانسیو --- */
        @media (max-width: 576px) {
            body { padding: 10px; align-items: flex-start; }
            .container { padding: 20px; border-radius: 16px; margin-top: 10px; margin-bottom: 10px; }
            h1 { font-size: 1.3rem; }
            h3 { font-size: 0.9rem; margin-bottom: 20px; }
            .question-title { font-size: 1.1rem; }
            .option-card { padding: 12px 15px; }
            .nav-buttons { flex-direction: column-reverse; }
            .btn-nav { width: 100%; }
            .actions-grid { flex-direction: column; }
            .actions-grid .btn { width: 100%; }
            .score-value { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- 1. صفحه شروع -->
    <div id="start-screen" class="container active">
        <h1>🔶 پرسشنامه تشخیص ADHD</h1>
        <h3>طراح آزمون: احسان افشارمنش (مشاور تحصیلی و روانشناس بالینی)</h3>
        
        <div class="form-group">
            <label for="inp-name">نام فرزند:</label>
            <input type="text" id="inp-name" placeholder="نام را وارد کنید">
        </div>
        <div class="form-group">
            <label for="inp-family">نام خانوادگی:</label>
            <input type="text" id="inp-family" placeholder="نام خانوادگی را وارد کنید">
        </div>
        <div class="form-group">
            <label for="inp-phone">شماره تلفن ولی:</label>
            <input type="tel" id="inp-phone" placeholder="مثال: 09123456789">
        </div>
        
        <button class="btn btn-primary" onclick="startQuiz()" style="margin-top: 10px;">شروع آزمون</button>
    </div>

    <!-- 2. صفحه آزمون -->
    <div id="quiz-screen" class="container">
        <div class="progress-wrapper">
            <div class="progress-info">
                <span id="progress-text">سوال 1 از 27</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </div>
        
        <div class="question-title" id="question-text">متن سوال...</div>
        
        <div class="options-list" id="options-container">
            <!-- گزینه‌ها توسط جاوااسکریپت ساخته می‌شوند -->
        </div>
        
        <div class="nav-buttons">
            <button class="btn btn-nav" id="btn-prev" onclick="prevQuestion()">سوال قبل</button>
            <button class="btn btn-nav" id="btn-next" onclick="nextQuestion()">سوال بعد</button>
        </div>
    </div>

    <!-- 3. صفحه نتایج -->
    <div id="result-screen" class="container">
        <div class="print-header">
            <h1>نتایج آزمون تشخیص ADHD (والدین)</h1>
            <p id="print-name" style="margin-top: 10px;"></p>
            <p id="print-date" style="font-size: 0.9rem; color: #555;"></p>
        </div>
        
        <div class="alert-info">
            ℹ️ این آزمون یک ابزار غربالگری اولیه است و به هیچ عنوان جایگزین تشخیص قطعی توسط متخصص نمی‌باشد.
        </div>

        <div class="score-card">
            <div class="score-title" id="result-name"></div>
            <div class="score-value" id="result-score">0</div>
            <div class="score-total">از 81 امتیاز</div>
        </div>

        <div class="recommendation-card" id="recommendation-box">
            <div class="rec-title" id="rec-title">وضعیت</div>
            <ul class="rec-list" id="rec-list">
                <!-- لیست توصیه‌ها -->
            </ul>
        </div>

        <div class="actions-grid">
            <button class="btn btn-print" onclick="window.print()">🖨️ چاپ نتایج</button>
            <button class="btn btn-restart" onclick="location.reload()">شروع مجدد</button>
        </div>
    </div>

    <script>
        // =========================================================
        // ⚠️ لینک Apps Script خود را اینجا بین دبل کوتیشن جایگزین کنید ⚠️
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxztiu0NHwcMGREwVNJ7D01KbWkO-3EuoSmG4egQYjBJAJINgjEAbvjpj4S_HCAyeMfsw/exec";
        // =========================================================

        const questions = [
            "بی‌توجه است، حواسش به راحتی پرت می‌شود.",
            "عصبانی و خشمگین است.",
            "در انجام دادن یا تمام کردن تکالیف مشکل دارد.",
            "همیشه در حال حرکت است یا طوری عمل می‌کند که انگار با یک موتور حرکت می‌کند.",
            "مدت زمان توجه و تمرکز او کوتاه است.",
            "با بزرگترها مشاجره می‌کند.",
            "دست یا پاهایش را تکان می‌دهد یا در جای خود وول می‌خورد.",
            "در تمام کردن تکالیفش ناموفق است.",
            "کنترل کردن او در فروشگاه‌های بزرگ یا هنگام خرید از مغازه دشوار است.",
            "در خانه یا مدرسه بی‌نظم و به هم ریخته است.",
            "کنترل خود را از دست می‌دهد.",
            "برای انجام تکالیف نیاز به نظارت از نزدیک دارد.",
            "فقط وقتی به چیزی علاقمند باشد به آن توجه می‌کند.",
            "در موقعیت‌های نامناسب به شدت می‌دود یا بالا و پایین می‌رود.",
            "حواس‌پرت است یا مدت زمان توجه و تمرکز او مشکل دارد.",
            "تحریک‌پذیر است.",
            "از مشغول شدن به تکالیفی که نیازمند تلاش ذهنی مدام است اجتناب می‌کند یا اکراه نشان می‌دهد.",
            "بی‌قرار است و وول می‌خورد.",
            "وقتی برای انجام کاری دستور می‌گیرد حواسش پرت می‌شود.",
            "به طور جدی با درخواست بزرگترها مخالفت می‌کند یا از انجام آن خودداری می‌نماید.",
            "در تمرکز پیدا کردن در کلاس مشکل دارد.",
            "در انتظار کشیدن در صف یا منتظر نوبت ماندن در بازی‌ها مشکل دارد.",
            "جای خود را در کلاس یا سایر موقعیت‌هایی که انتظار می‌رود در جای خود باقی بماند ترک می‌کند.",
            "عمداً کارهایی می‌کند که دیگران را آزار دهد.",
            "دستورات را پیگیری نمی‌کند و در تمام کردن وظایف خود ناموفق است.",
            "برای او مشکل است که به آرامی بازی کند یا به فعالیت‌های سرگرم‌کننده مشغول باشد.",
            "به راحتی در تلاش‌هایش مایوس می‌شود."
        ];

        const optionsData = [
            { text: "هرگز", value: 0 },
            { text: "گاهی", value: 1 },
            { text: "اغلب", value: 2 },
            { text: "خیلی زیاد", value: 3 }
        ];

        let userInfo = {};
        let answers = new Array(27).fill(null);
        let currentIndex = 0;

        function startQuiz() {
            const name = document.getElementById('inp-name').value.trim();
            const family = document.getElementById('inp-family').value.trim();
            const phone = document.getElementById('inp-phone').value.trim();

            if (!name || !family || !phone) {
                alert("لطفاً تمام اطلاعات (نام، نام خانوادگی و شماره تلفن) را وارد کنید!");
                return;
            }

            if (phone.length < 10) {
                alert("لطفاً یک شماره تلفن معتبر وارد کنید.");
                return;
            }

            userInfo = { name, family, phone };
            currentIndex = 0;
            
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('quiz-screen').classList.add('active');
            renderQuestion();
        }

        function renderQuestion() {
            const qText = document.getElementById('question-text');
            const optsContainer = document.getElementById('options-container');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            
            // آپدیت پیشرفت
            const progressPercent = ((currentIndex) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('progress-percent').innerText = `${Math.round(progressPercent)}%`;
            document.getElementById('progress-text').innerText = `سوال ${currentIndex + 1} از ${questions.length}`;

            qText.innerText = `${currentIndex + 1}. ${questions[currentIndex]}`;

            optsContainer.innerHTML = '';
            optionsData.forEach(opt => {
                const label = document.createElement('label');
                label.className = 'option-card';
                if (answers[currentIndex] === opt.value) {
                    label.classList.add('selected');
                }

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'q_option';
                radio.value = opt.value;
                radio.checked = (answers[currentIndex] === opt.value);
                
                               label.onclick = (e) => {
                    e.preventDefault(); // جلوگیری از رفتار پیش‌فرض موبایل
                    radio.checked = true; // تیک زدن دستی
                    
                    answers[currentIndex] = opt.value;
                    document.querySelectorAll('.option-card').forEach(l => l.classList.remove('selected'));
                    label.classList.add('selected');

                    // انتقال خودکار به سوال بعدی
                    if (currentIndex < questions.length - 1) {
                        setTimeout(() => {
                            nextQuestion(true);
                        }, 450); 
                    }
                };

                const customRadio = document.createElement('div');
                customRadio.className = 'custom-radio';

                const span = document.createElement('span');
                span.className = 'option-text';
                span.innerText = opt.text;

                label.appendChild(customRadio);
                label.appendChild(span);
                optsContainer.appendChild(label);
            });

            btnPrev.disabled = (currentIndex === 0);
            if (currentIndex === questions.length - 1) {
                btnNext.innerText = "مشاهده نتیجه ✓";
                btnNext.style.background = "var(--success)";
                btnNext.style.color = "white";
            } else {
                btnNext.innerText = "سوال بعد";
                btnNext.style.background = "#f1f3f5";
                btnNext.style.color = "var(--text-main)";
            }
        }

        function nextQuestion(auto = false) {
            if (!auto && answers[currentIndex] === null) {
                alert("لطفاً یک گزینه را انتخاب کنید.");
                return;
            }

            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function finishQuiz() {
            if (answers.includes(null)) {
                alert("لطفاً به تمام سوالات پاسخ دهید.");
                return;
            }

            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');

            // اسکرول به بالا
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const totalScore = answers.reduce((a, b) => a + b, 0);
            
            document.getElementById('result-name').innerText = `نتیجه آزمون ${userInfo.name} ${userInfo.family}`;
            document.getElementById('result-score').innerText = totalScore;
            
            const today = new Date().toLocaleDateString('fa-IR');
            document.getElementById('print-name').innerText = `نام: ${userInfo.name} ${userInfo.family} | تلفن: ${userInfo.phone}`;
            document.getElementById('print-date').innerText = `تاریخ آزمون: ${today}`;

            const box = document.getElementById('recommendation-box');
            const title = document.getElementById('rec-title');
            const list = document.getElementById('rec-list');

            box.className = 'recommendation-card';

            if (totalScore <= 20) {
                box.classList.add('mild');
                title.innerText = "🟢 وضعیت: علائم خفیف یا احتمال پایین ADHD";
                list.innerHTML = `
                    <li>توصیه می‌شود برنامه‌ریزی منظمی برای فعالیت‌های روزانه فرزندتان داشته باشید.</li>
                    <li>مشاوره با روانشناس کودک برای بررسی دقیق‌تر توصیه می‌شود.</li>
                    <hr>
                    <li class="emergency">تلفن اورژانس اجتماعی (۲۴ ساعته): ۱۲۳</li>
                    <li class="emergency">تلفن اورژانس دانش آموزی (۸ صبح تا ۸ شب): ۱۵۷۰</li>
                `;
            } else if (totalScore <= 50) {
                box.classList.add('moderate');
                title.innerText = "🟡 وضعیت: علائم متوسط یا احتمال متوسط ADHD";
                list.innerHTML = `
                    <li>توصیه اکید به مراجعه به روانشناس یا روانپزشک کودک دارید.</li>
                    <li>استفاده از تکنیک‌های رفتاری برای مدیریت تمرکز در خانه و مدرسه.</li>
                    <li>هماهنگی با مشاور مدرسه برای پیگیری وضعیت تحصیلی.</li>
                    <hr>
                    <li class="emergency">تلفن اورژانس اجتماعی (۲۴ ساعته): ۱۲۳</li>
                    <li class="emergency">تلفن اورژانس دانش آموزی (۸ صبح تا ۸ شب): ۱۵۷۰</li>
                `;
            } else {
                box.classList.add('severe');
                title.innerText = "🔴 وضعیت: علائم شدید یا احتمال بالای ADHD";
                list.innerHTML = `
                    <li>ضروری است در اسرع وقت با یک روانپزشک کودک و نوجوان مشورت کنید.</li>
                    <li>درمان‌های رفتاری و در صورت تشخیص پزشک، دارودرمانی می‌تواند بسیار کمک‌کننده باشد.</li>
                    <li>آموزش خانواده برای نحوه برخورد صحیح با کودک در این شرایط توصیه می‌شود.</li>
                    <hr>
                    <li class="emergency">تلفن اورژانس اجتماعی (۲۴ ساعته): ۱۲۳</li>
                    <li class="emergency">تلفن اورژانس دانش آموزی (۸ صبح تا ۸ شب): ۱۵۷۰</li>
                `;
            }

            sendDataToGoogleSheet(totalScore);
        }

        function sendDataToGoogleSheet(score) {
            if (GOOGLE_SCRIPT_URL === "https://script.google.com/macros/s/AKfycbxztiu0NHwcMGREwVNJ7D01KbWkO-3EuoSmG4egQYjBJAJINgjEAbvjpj4S_HCAyeMfsw/exec" || !GOOGLE_SCRIPT_URL) {
                console.warn("لینک Apps Script تنظیم نشده است. اطلاعات ارسال نشد.");
                return;
            }

            const formData = new URLSearchParams();
            formData.append("name", userInfo.name);
            formData.append("family", userInfo.family);
            formData.append("phone", userInfo.phone);
            formData.append("score", score);

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: formData,
                mode: 'no-cors'
            })
            .then(() => console.log("داده با موفقیت ارسال شد."))
            .catch(err => console.error("خطا در ارسال: ", err));
        }
    </script>
